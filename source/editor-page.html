<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Testing</title>
    <link rel="stylesheet" href="./static/css/editor-page.css">
  </head>
  <body class="body">
    <main class="main">
      <form id="toolbox">
        <fieldset>
          <legend>Tool</legend>
          <label for="select"> Select <input type="radio" id="select" value="0" name="tool" checked/> </label>
          <label for="pencil"> Pencil <input type="radio" id="pencil" value="1" name="tool" /> </label>
          <label for="box"   > Box    <input type="radio" id="box"    value="2" name="tool" /> </label>
          <label for="ellipse">Ellipse<input type="radio" id="ellipse"value="3" name="tool" /> </label>
          <label for="image" > Image  <input type="radio" id="image"  value="4" name="tool" /> </label>
          <label for="text"  > Text   <input type="radio" id="text"   value="5" name="tool" /> </label>
        </fieldset>
      </form>

      <canvas id="business_card"></canvas>
    </main>

    <script type="module" src="./static/js/canvas.js"></script>
  </body>
</html>
