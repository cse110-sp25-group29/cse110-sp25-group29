<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title id="page-title">Concard | Name</title>
    <link rel="shortcut icon" href="./icons/logo-light.svg">
    <link rel="stylesheet" href="./styles/editor-page.css">
  </head>
  <body class="body">
    <header class="header">
      <section id="home-button-section">
        <button class="header-button" id="back-button" title="Back">
          <img src="./icons/arrow-back.svg">
        </button>

        <button class="header-button" id="home-button" title="Home">
          <img src="./icons/home.png">
        </button>
      </section>

      <!-- Empty div for positioning -->
      <div></div>

      <div id="card-title-container">
        <span contenteditable="true" id="card-title" name="card-title"></span>
        <div id="save-star"></div>
      </div>
        
      <section id="other-buttons">
        <div class="dropdown">
          <button class="header-button" id="export-button" title="Export">
            <img src="./icons/download.svg">
          </button>
          <div class="dropdown-content">
            <button title="Export to JSON file" id="export-json">To JSON...</button>
            <button title="Export to PNG file" id="export-png">To PNG...</button>
            <button title="Export to JPG file" id="export-jpg">To JPG...</button>
          </div>
        </div>

        <div class="dropdown">
          <button class="header-button" id="save-button" title="Save">
            <img src="./icons/save.svg">
          </button>
          <div class="dropdown-content">
            <button title="Save as..." id="save-as">Save As...</button>
          </div>
        </div>

        <div class="dropdown">
          <button class="header-button" id="import-button" title="Import">
            <img src="./icons/file.svg">
          </button>
          <div class="dropdown-content">
            <button title="Open a saved card" id="file-open">Open</button>
            <button title="Create a new card" id="file-new">New</button>
            <button title="Duplicate to new business card" id="file-duplicate">Duplicate</button>
          </div>
        </div>
        
        <button type="button" class="header-button" id="reset-button" title="Reset">
          <img src="./icons/reset.svg">
        </button>
        
        <button type="button" class="header-button" id="delete-button" title="Delete">
          <img src="./icons/delete.svg">
        </button>
      </section>
    </header>
    <main class="main">
      <form id="toolbox">
        <h2 id="tool-h2">Tool</h2>

        <fieldset>
          <br>
          <div>
            <label for="select">
            <div>
              <input type="radio" id="select" name="tool" value="0" checked hidden/> 
              <img src="./icons/selector-tool.svg" class="input svg-icon"/>
            </div>
            </label>
          </div>

          <hr>

          <div id="text">
            <label for="heading">
            <div>
              Heading<input type="radio" id="heading" name="tool" value="5" hidden/> 
            </div>
            </label>

            <label for="subheading">
            <div>
              Subheading<input type="radio" id="subheading" name="tool" value="6" hidden/> 
            </div>
            </label>

            <label for="body">
            <div>
              Body<input type="radio" id="body" name="tool" value="7" hidden/> 
            </div>
            </label>
          </div>

          <hr>

          <div id="shapes">
            <label for="square">
            <div>
              <input type="radio" id="square" name="tool" value="8" hidden/>
              <img src="./icons/square.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="circle">
            <div>
              <input type="radio" id="circle" name="tool" value="9" hidden/>
              <img src="./icons/circle.svg" class="input svg-icon"/>
            </div>
            </label>
          </div>

          <hr>

          <div id="socials">
            <label for="instagram">
            <div>
              <input type="radio" id="instagram" name="tool" value="2" hidden/>
              <img src="./icons/instagram.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="facebook">
            <div>
              <input type="radio" id="facebook" name="tool" value="1" hidden/>
              <img src="./icons/facebook.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="youtube">
            <div>
              <input type="radio" id="youtube" name="tool" value="10" hidden/>
              <img src="./icons/youtube.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="tiktok">
            <div>
              <input type="radio" id="tiktok" name="tool" value="11" hidden/>
              <img src="./icons/tiktok.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="linkedin">
            <div>
              <input type="radio" id="linkedin" name="tool" value="3" hidden/>
              <img src="./icons/linkedin.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="mail">
            <div>
              <input type="radio" id="mail" name="tool" value="4" hidden/>
              <img src="./icons/mail.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="tumblr">
            <div>
              <input type="radio" id="tumblr" name="tool" value="12" hidden/>
              <img src="./icons/tumblr.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="x">
            <div>
              <input type="radio" id="x" name="tool" value="13" hidden/>
              <img src="./icons/x.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="website">
            <div>
              <input type="radio" id="website" name="tool" value="14" hidden/>
              <img src="./icons/globe.svg" class="input svg-icon"/>
            </div>
            </label>

            <label for="phone">
            <div>
              <input type="radio" id="phone" name="tool" value="15" hidden/>
              <img src="./icons/phone.svg" class="input svg-icon"/>
            </div>
            </label>
          </div>
        </fieldset>
      </form>

      <section id="center">
        <div id="popup-menu">
        </div>

        <div>
          <div class="business-card">
            <canvas id="front-card"></canvas>
            <canvas id="back-card"></canvas>
          </div>

          <button id="flip-button">Flip to Back!</button>
        </div>
      </section>

      <section id="attribute-sel">
      </section>
    </main>

    <script type="module" src="./scripts/editor-page.js"></script>
  </body>
</html>
