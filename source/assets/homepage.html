<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Concard | Home</title>
    <link rel="shortcut icon" href="./icons/logo-light.svg">
    <link rel="stylesheet" href="./styles/homepage.css" />
    <script type="module" src="./scripts/homepage.js"></script>
</head>
<body>
    <header>
        <img id="concard" src="./icons/title-centered-light.svg" alt="Concard">
        <button id="theme-toggle" aria-label="Toggle Theme"><img src="./icons/dark-mode.svg"></button>
        <div class="search-bar">
            <button><img src="./icons/search.svg" width="36" height="36" alt="search"></button>

            <input id="search-input" type="text">
            <!-- placeholder="Search wallet, person..."> -->
        </div>
    </header>

    <div class="card-container">
        <button-col>
            <div class="card-button">
            <!-- <label>New Card</label> -->
            <a href="./editor-page.html">
                <button id="new-card-button">
                    <span class="icon">
                        <img src="./icons/plus.svg" width="36" height="36" alt="New Card">
                    </span>
                </button>
            </a>  
            </div>

            <div class="card-button">
                <!-- <label>All Cards</label> -->
                <a href="./view_all_card.html">
                 <!-- id="all-card-button"> -->
                    <button id="all-card-button">
                        <span class="icon">
                            <img src="./icons/grid.svg" width="36" height="36" alt="All Card">
                        </span>
                    </button>
                </a>
            </div>
        </button-col>

        <button-col>
            <div class="card-button">
            <!-- <label>Upload Card</label> -->
            <button id="upload-button">
                <span class="icon">
                    <img src="./icons/upload.svg" width="36" height="36" alt="Upload Card">
                </span>
            </button>
            </div>
            
            <div class="card-button">
            <!-- <label>Your Card</label> -->
            <button id="your-card-button">
                <span class="icon">
                    <img src="./icons/user.svg" width="36" height="36" alt="Your Card">
                </span>
            </button>
            </div>
        </button-col>      
    </div>
      


    <!-- <div class="link-to-all">
        <a href="view_all_card.html"><i>View All Cards</i></a>
    </div> -->

    <div class="link-to-info">
        <div class="how-it-works">
            <a href="https://cse110-sp25-group29.github.io/cse110-sp25-group29/docs/index.html" target="_blank" rel="noopener noreferrer"><i>How it works</i></a>
        </div>
        <div class="github">
            <a href="https://github.com/cse110-sp25-group29/cse110-sp25-group29" target="_blank"><i>GitHub</i></a>
        </div>
        <div class="team">
            <a href="https://cse110-sp25-group29.github.io/cse110-sp25-group29/admin/team.html" target="_blank"><i>Our Team</i></a>
        </div>
    </div>


</body>
</html>
