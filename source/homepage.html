<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Card Maker App</title>
    <link rel="stylesheet" href="assets/styles/homepage.css" />
    <script type="module" src="assets/scripts/homepage.js"></script>
</head>
<body>
    <header>
        <h1>Concard</h1>
        <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
    </header>

    <div class="card-container">
        <div class="card-button">
          <label>New Card</label>
          <a href="assets/editor-page.html">
            <button>
                <span class="icon">
                    <img src="assets/icons/Plus.png" width="36" height="36" alt="Your Card">
                </span>
            </button>
          </a>  
        </div>
        <div class="card-button">
          <label>Upload Card</label>
          <button id="upload-button">
            <span class="icon">
                <img src="assets/icons/upload.png" width="36" height="36" alt="Your Card">
            </span>
          </button>
        </div>
        <div class="card-button">
          <label>Your Card</label>
          <button id="your-card-button">
            <span class="icon">
                <img src="assets/icons/Person_green.png" width="36" height="36" alt="Your Card">
            </span>
          </button>
        </div>
    </div>
      
    <div class="search-bar">
        <img src="assets/icons/Search.png" width="36" height="36" alt="Your Card">
        <input type="text" placeholder="Search wallet, person...">
    </div>

    <div class="link-to-all">
        <a href="assets/view_all_card.html"><i>View All Cards</i></a>
    </div>

    <div class="link-to-info">
        <div class="how-it-works">
            <a href=""><i>How it works</i></a>
        </div>
        <div class="github">
            <a href="https://github.com/cse110-sp25-group29/cse110-sp25-group29" target="_blank"><i>GitHub</i></a>
        </div>
        <div class="team">
            <a href="https://cse110-sp25-group29.github.io/cse110-sp25-group29/admin/team.html" target="_blank"><i>Our Team</i></a>
        </div>
    </div>


</body>
</html>
