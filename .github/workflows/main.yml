name: Code Quality and Tests 

on: [push] 

jobs:
  tests: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install
      - name: Run linter test
        run: npm run lint:fix
      - name: Unit Test For Homepage
        run: npm run unithometest
      - name: E2E Test For Homepage
        run: npm run e2ehometest
      - name: Unit Test for Editor page
        run: npm run uniteditortest
      - name: E2E test for Editor page
        run: npm run e2eeditortest
      - name: Generate JSDoc
        run: npm run docs
